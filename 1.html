<!DOCTYPE html>
<html>
	<head>
		<title></title>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<script>
			const synth = window.speechSynthesis;

			let swedish_voice
			let debounce_timer
			let debounce_value

			function debounce(s) {
				let update = false
				update |= (debounce_timer === undefined)
				update |= (debounce_value === undefined)
				update |= (debounce_value != s)
				now = new Date()
				if (!update) {
					let duration = now.getTime() - debounce_timer.getTime()
					if (duration > 1000) {
						update = true
					}
				}
				if (update) {
					debounce_timer = now
					debounce_value = s
				}
				return update
			}

			function get_swedish_voice(mode) {
				const voices = speechSynthesis.getVoices()
				let swedish = []
				let i = 0
				let current = 0
				for (const voice of voices) {
					if (voice.lang != "sv") {
						continue
					}
					swedish.push(voice)
					i++
					if (swedish_voice !== undefined) {
						if (voice.name == swedish_voice.name) {
							current = i - 1
						}
					}
					if (mode != "best") {
						continue
					}
					if (voice.name == "Swedish+Robosoft5") {
						return voice
					}
				}
				if (mode == "best") {
					// should have returned already
					console.log("Did not find preferred voice!")
				}
				let index = 0
				if (mode == "random") {
					index = Math.floor(Math.random() * swedish.length);
				}
				else if (mode == "+") {
					index = (current + 1) % swedish.length
				}
				else if (mode == "-") {
					index = (current + swedish.length - 1) % swedish.length
				}
				return swedish[index]
			}

			function choose_voice(mode) {
				swedish_voice = get_swedish_voice(mode)
				console.log(swedish_voice.name)
				utter_voice_name()
			}

			function voice_init() {
				if (swedish_voice === undefined) {
					choose_voice("best")
				}
				if (swedish_voice === undefined) {
					choose_voice("random")
				}
			}

			function utter_voice_name() {
				const utter = new SpeechSynthesisUtterance(swedish_voice.name)
				utter.voice = swedish_voice
				synth.speak(utter)
			}

			setTimeout(() => {
				voice_init()
			}, "500")

			window.addEventListener("keydown", (e) => {
				if (!debounce(e.code)) {
					console.debug("Debounced: " + e.code)
					return
				}
				let s = ""
				if (e.code == "Enter") {
					choose_voice("best")
					return
				}
				else if (e.code == "Space") {
					choose_voice("random")
					return
				}
				else if (e.code == "ArrowUp") {
					choose_voice("+")
					return
				}
				else if (e.code == "ArrowDown") {
					choose_voice("-")
					return
				}
				else if (e.code == "BracketLeft") {
					s = "Å"
				}
				else if (e.code == "Quote") {
					s = "Ä"
				}
				else if (e.code == "Semicolon") {
					s = "Ö"
				}
				else if (e.code.startsWith("Key")) {
					s = e.code.replace("Key", "")
				}
				else if (e.code.startsWith("Digit")) {
					s = e.code.replace("Digit", "")
				}
				else {
					console.debug("Ignore: " + e.code)
					return
				}
				let div = document.getElementById("div")
				div.innerHTML = s;
				let fg
				let bg
				if (div.style.color == "white") {
					fg = "black"
					bg = "white"
				} else {
					fg = "white"
					bg = "black"
				}
				div.style.color = fg
				div.style.backgroundColor = bg

				voice_init()
				const utter = new SpeechSynthesisUtterance(s)
				utter.voice = swedish_voice
				synth.speak(utter)
			})
		</script>
		<style type="text/css">
        html, body {
            height: 100%;
            margin: 0;
        }

        #div {
            min-height: 100%;
	    background-color: white;
	    color: black;
	    font-size: 40vw;
	    text-align: center;
        }
		 </style>
	</head>
	<body>
		<div id="div">A</div>
	</body>
</html>
