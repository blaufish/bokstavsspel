<!DOCTYPE html>
<html>
	<head>
		<title></title>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<script>
			const synth = window.speechSynthesis;

			let swedish_voice
			let debounce_timer
			let debounce_value
			function debounce(s) {
				let update = false
				update |= (debounce_timer === undefined)
				update |= (debounce_value === undefined)
				update |= (debounce_value != s)
				now = new Date()
				if (!update) {
					let duration = now.getTime() - debounce_timer.getTime()
					if (duration > 1000) {
						update = true
					}
				}
				if (update) {
					debounce_timer = now
					debounce_value = s
				}
				return update
			}

			function random_swedish_voice() {
				const voices = speechSynthesis.getVoices()
				let swedish = []
				for (const voice of voices) {
					if (voice.lang == "sv") {
						swedish.push(voice)
					}
				}
				return swedish[Math.floor(Math.random() * swedish.length)];
			}
			function best_voice() {
				const voices = speechSynthesis.getVoices()
				for (const voice of voices) {
					if (voice.lang == "sv") {
						if (voice.name == "Swedish+Robosoft5") {
							return voice
						}
					}
				}
				console.log("Did not find preferred voice!")
				return undefined
			}
			function new_voice() {
				swedish_voice = random_swedish_voice()
			}
			function voice_init() {
				if (swedish_voice === undefined) {
					swedish_voice = best_voice()
				}
				if (swedish_voice === undefined) {
					swedish_voice = random_swedish_voice()
				}
			}
			window.addEventListener("keydown", (e) => {
				let s = ""
				if (e.code == "Enter") {
					swedish_voice = best_voice()
					console.log(swedish_voice.name)
					return
				}
				else if (e.code == "Space") {
					new_voice()
					console.log(swedish_voice.name)
					return
				}
				else if (e.code == "BracketLeft") {
					s = "Å"
				}
				else if (e.code == "Quote") {
					s = "Ä"
				}
				else if (e.code == "Semicolon") {
					s = "Ö"
				}
				else if (e.code.startsWith("Key")) {
					s = e.code.replace("Key", "")
				}
				else if (e.code.startsWith("Digit")) {
					s = e.code.replace("Digit", "")
				}
				else {
					console.debug("Ignore: " + e.code)
					return
				}
				if (!debounce(s)) {
					console.debug("Debounced: " + s)
					return
				}
				let div = document.getElementById("div")
				div.innerHTML = s;
				let fg
				let bg
				if (div.style.color == "white") {
					fg = "black"
					bg = "white"
				} else {
					fg = "white"
					bg = "black"
				}
				div.style.color = fg
				div.style.backgroundColor = bg

				voice_init()
				const utter = new SpeechSynthesisUtterance(s)
				utter.voice = swedish_voice
				synth.speak(utter)
			})
		</script>
		<style type="text/css">
        html, body {
            height: 100%;
            margin: 0;
        }

        #div {
            min-height: 100%;
	    background-color: white;
	    color: black;
	    font-size: 40vw;
	    text-align: center;
        }
		 </style>
	</head>
	<body>
		<div id="div">A</div>
	</body>
</html>
