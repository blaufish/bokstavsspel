<!DOCTYPE html>
<html>
	<head>
		<title></title>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<script src="beep.js"></script>
		<script>
			const synth = window.speechSynthesis;
			function random_swedish_voice() {
				const voices = speechSynthesis.getVoices()
				let swedish = []
				for (const voice of voices) {
					if (voice.lang == "sv") {
						swedish.push(voice)
					}
				}
				return swedish[Math.floor(Math.random() * swedish.length)];
			}
			function best_voice() {
				const voices = speechSynthesis.getVoices()
				for (const voice of voices) {
					if (voice.lang == "sv") {
						if (voice.name == "Swedish+Robosoft5") {
							return voice
						}
					}
				}
				console.log("Did not find preferred voice!")
				return undefined
			}
			function new_voice() {
				swedish_voice = random_swedish_voice()
			}
			function voice_init() {
				if (swedish_voice === undefined) {
					swedish_voice = best_voice()
				}
				if (swedish_voice === undefined) {
					swedish_voice = random_swedish_voice()
				}
			}
			let swedish_voice
			window.addEventListener("keydown", (e) => {
				let s = ""
				if (e.code == "Enter") {
					swedish_voice = best_voice()
					console.log(swedish_voice.name)
					return
				}
				else if (e.code == "Space") {
					new_voice()
					console.log(swedish_voice.name)
					return
				}
				else if (e.code == "BracketLeft") {
					s = "Å"
				}
				else if (e.code == "Quote") {
					s = "Ä"
				}
				else if (e.code == "Semicolon") {
					s = "Ö"
				}
				else if (e.code.startsWith("Key")) {
					s = e.code.replace("Key", "")
				}
				else {
					return
				}
				let div = document.getElementById("div")
				div.innerHTML = s;
				let fg
				let bg
				if (div.style.color == "white") {
					fg = "black"
					bg = "white"
				} else {
					fg = "white"
					bg = "black"
				}
				div.style.color = fg
				div.style.backgroundColor = bg

				voice_init()
				const utter = new SpeechSynthesisUtterance(s)
				utter.voice = swedish_voice
				synth.speak(utter)
			})
		</script>
		<style type="text/css">
        html, body {
            height: 100%;
            margin: 0;
        }

        #div {
            min-height: 100%;
	    background-color: white;
	    color: black;
	    font-size: 40vw;
	    text-align: center;
        }
		 </style>
	</head>
	<body>
		<div id="div">A</div>
	</body>
</html>
